# Builds the Windows exe for a pushed vX.Y.Z tag and publishes it through the shared jmusick/ci
# release workflow.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Write release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Set-Content -Path version.txt -Value $version -NoNewline

      - name: Build executable
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name HiddenLodgeDesktop `
            --icon icon.ico `
            --add-data "config.example.json;." `
            --add-data "icon.ico;." `
            --add-data "version.txt;." `
            main.py

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/HiddenLodgeDesktop.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build
    permissions:
      contents: write
    uses: jmusick/ci/.github/workflows/release.yml@a8ac9c292577382c63e5a38af58d38a4cd6f8504 # v0.3.0
    with:
      artifact-name: release-files
